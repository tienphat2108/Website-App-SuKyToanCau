    <g fill="#f2cf8b" opacity="0.92">
      <path d="M0 -92 L14 -28 L78 -54 L28 -8 L92 18 L24 30 L44 94 L0 46 L-44 94 L-24 30 L-92 18 L-28 -8 L-78 -54 L-14 -28 Z"/>
    </g>
    <circle r="22" fill="url(#bronze)" stroke="#5f3717" stroke-width="3"/>
    <circle r="8" fill="#f2cf8b"/>

    <g fill="#5f3717" opacity="0.55">
      <circle cx="0" cy="-160" r="5"/>
      <circle cx="113" cy="-113" r="5"/>
      <circle cx="160" cy="0" r="5"/>
      <circle cx="113" cy="113" r="5"/>
      <circle cx="0" cy="160" r="5"/>
      <circle cx="-113" cy="113" r="5"/>
      <circle cx="-160" cy="0" r="5"/>
      <circle cx="-113" cy="-113" r="5"/>
    </g>

    <g fill="#5f3717" opacity="0.7">
      <path d="M-150 -48 c 12 -16 30 -16 42 0 c -12 8 -30 8 -42 0 Z"/>
      <path d="M108 -48 c 12 -16 30 -16 42 0 c -12 8 -30 8 -42 0 Z"/>
      <path d="M-150 60 c 12 -16 30 -16 42 0 c -12 8 -30 8 -42 0 Z"/>
      <path d="M108 60 c 12 -16 30 -16 42 0 c -12 8 -30 8 -42 0 Z"/>
    </g>
  </g>

  <g fill="#f2cf8b" opacity="0.7">
    <circle cx="150" cy="720" r="2"/>
    <circle cx="210" cy="770" r="1.4"/>
    <circle cx="1080" cy="700" r="2.2"/>
    <circle cx="1010" cy="780" r="1.5"/>
  </g>

  <g stroke="#f2cf8b" stroke-width="1.2" opacity="0.35" fill="none">
    <path d="M70 240 h160"/>
    <path d="M70 258 h96"/>
    <path d="M70 276 h120"/>
  </g>
</svg>
