    <circle r="230" fill="url(#bronze)"/>
    <circle r="230" fill="url(#drumPattern)" opacity="0.5"/>
    <circle r="230" fill="none" stroke="#f2cf8b" stroke-width="3" opacity="0.7"/>
    <circle r="196" fill="none" stroke="#5f3717" stroke-width="5" opacity="0.65"/>
    <circle r="180" fill="none" stroke="#f2cf8b" stroke-width="1.6" opacity="0.55"/>
    <circle r="146" fill="none" stroke="#5f3717" stroke-width="3" opacity="0.55"/>
    <circle r="136" fill="none" stroke="#f2cf8b" stroke-width="1.2" opacity="0.5"/>

    <g fill="none" stroke="#5f3717" stroke-width="3" opacity="0.65">
