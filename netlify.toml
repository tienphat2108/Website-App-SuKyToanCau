# Netlify dựng giao diện bằng bộ thích ứng OpenNext.
# Tệp đặt ở thư mục gốc kho để Netlify chắc chắn đọc. Mục Base directory vẫn
# phải đặt trong giao diện, vì thư mục gốc không có package.json.

[build]
  command = "npm run build"
  # Bản dựng Next.js nằm trong frontend/.next; bộ cắm chuyển nó sang dạng
  # Netlify phục vụ, gồm cả Server Actions, middleware và tiêu đề bảo mật.
  publish = ".next"
  # Lượt đẩy chỉ thay đổi tệp dữ liệu quét nguồn mở thì bỏ qua dựng: trang
  # /updates đọc tệp này trực tiếp từ CDN của kho GitHub lúc chạy, không cần
  # dựng lại website (tiết kiệm phút dựng miễn phí của Netlify).
  ignore = "cd $(git rev-parse --show-toplevel) && git diff --quiet HEAD^ HEAD -- . ':(exclude)shared/recent-events.json'"

[build.environment]
  # Khớp ảnh node:22-alpine trong devops/Dockerfile.web.
  NODE_VERSION = "22"
  # Chặn trình duyệt gọi bản dựng cũ sau khi có bản dựng mới.
  NETLIFY_NEXT_SKEW_PROTECTION = "true"
  # Địa chỉ công khai, dùng cho siêu dữ liệu, sơ đồ trang và chuyển hướng giao thức.
  NEXT_PUBLIC_SITE_URL = "https://sukytoancau.netlify.app"

[[plugins]]
  package = "@netlify/plugin-nextjs"
